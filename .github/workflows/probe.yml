name: probe-funding-sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try public funding-rate endpoints from this runner
        run: |
          t() { printf '%-12s ' "$1"; curl -s -m 15 -o /tmp/o -w 'HTTP %{http_code} %{size_download}B ' "${@:2}"; head -c 160 /tmp/o | tr '\n' ' '; echo; }
          t binance  "https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=2"
          t okx      "https://www.okx.com/api/v5/public/funding-rate-history?instId=BTC-USDT-SWAP&limit=2"
          t bybit    "https://api.bybit.com/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=2"
          t bitget   "https://api.bitget.com/api/v2/mix/market/history-fund-rate?symbol=BTCUSDT&productType=usdt-futures&pageSize=2"
          t gate     "https://api.gateio.ws/api/v4/futures/usdt/funding_rate?contract=BTC_USDT&limit=2"
          t kucoin   "https://api-futures.kucoin.com/api/v1/contract/funding-rates?symbol=XBTUSDTM&from=1795000000000&to=1795600000000"
          t mexc     "https://contract.mexc.com/api/v1/contract/funding_rate/history?symbol=BTC_USDT&page_num=1&page_size=2"
          t hyperliq -X POST -H "Content-Type: application/json" -d '{"type":"fundingHistory","coin":"BTC","startTime":1795500000000}' "https://api.hyperliquid.xyz/info"
          t gate_alt "https://api.gateio.ws/api/v4/futures/usdt/funding_rate?contract=1INCH_USDT&limit=2"
          t okx_alt  "https://www.okx.com/api/v5/public/funding-rate-history?instId=GALA-USDT-SWAP&limit=2"
