name: paper-bot

# Runs the paper-trading bot (simulated money only, no exchange account, no API key)
# a few minutes after every 4-hour candle close, then commits the updated records.
on:
  schedule:
    # GitHub starts scheduled runs late and sometimes drops them, so this fires twice an hour
    # and the "gate" job below lets only the first run after each 4-hour candle close do the work.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  # Has the latest 4-hour candle already been processed? Manual runs always go ahead.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, time
          TF = 14_400_000
          try:
              done = json.load(open("logs/pattern_positions.json", encoding="utf-8"))["updated"] or 0
          except Exception:
              done = 0
          close = int(time.time() * 1000) // TF * TF          # when the latest 4-hour candle closed
          print("go=" + ("true" if os.environ["EVENT"] != "schedule" or done < close + 60_000 else "false"))
          EOF
          cat "$GITHUB_OUTPUT"

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # price and funding history live in a cache, not in the repository
      - name: Restore market data
        uses: actions/cache/restore@v4
        with:
          path: |
            data_oos
            data_funding
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      - name: Make sure history exists
        run: python cloud_fetch.py

      - name: Run one cycle
        run: python run_pattern.py --once

      - name: Write status page and trade charts
        run: python status_md.py

      - name: Save market data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data_oos
            data_funding
          key: market-data-${{ github.run_id }}

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/pattern_state.json logs/pattern_positions.json STATUS.md TRADES.md
          git add -A charts trades 2>/dev/null || true
          git add logs/pattern_trades.csv logs/pattern_events.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update paper-trading records"
          git pull --rebase -q origin main    # tolerate a push that landed while this run was working
          git push

      # the full interactive chart page becomes the public website: it is pushed as the only
      # commit of the gh-pages branch (replaced every run, so the repository does not grow)
      - name: Publish website
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish chart page"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      # ask for a rebuild explicitly, in case the push above does not trigger one
      - name: Refresh website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
