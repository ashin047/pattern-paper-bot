name: paper-bot

# Runs the paper-trading bot (simulated money only, no exchange account, no API key)
# a few minutes after every 4-hour candle close, then commits the updated records.
on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # price and funding history live in a cache, not in the repository
      - name: Restore market data
        uses: actions/cache/restore@v4
        with:
          path: |
            data_oos
            data_funding
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      - name: Make sure history exists
        run: python cloud_fetch.py

      - name: Run one cycle
        run: python run_pattern.py --once

      - name: Write status page and trade charts
        run: python status_md.py

      - name: Save market data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data_oos
            data_funding
          key: market-data-${{ github.run_id }}

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/pattern_state.json logs/pattern_positions.json STATUS.md TRADES.md
          git add -A charts trades 2>/dev/null || true
          git add logs/pattern_trades.csv logs/pattern_events.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update paper-trading records"
          git push

      # the full interactive chart page becomes the public website: it is pushed as the only
      # commit of the gh-pages branch (replaced every run, so the repository does not grow)
      - name: Publish website
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish chart page"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      # ask for a rebuild explicitly, in case the push above does not trigger one
      - name: Refresh website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
