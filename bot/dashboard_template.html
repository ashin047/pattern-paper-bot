<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>形態交易統計</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --border: #e3e1db; --grid: #ebe9e4;
  --text: #0b0b0b; --text2: #52514e; --muted: #85837d;
  --long: #2a78d6; --short: #eb6834;
  --up: #1baf7a; --down: #e34948; --good: #0ca30c; --bad: #d03b3b;
  --band: rgba(42,120,214,.09); --sel: rgba(42,120,214,.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #33332f; --grid: #2a2a27;
    --text: #f0efec; --text2: #c3c2b7; --muted: #8d8c84;
    --long: #3987e5; --short: #d95926;
    --up: #199e70; --down: #e66767; --band: rgba(57,135,229,.14); --sel: rgba(57,135,229,.2);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 2px; }
h2 { font-size: 15px; margin: 0 0 2px; }
.sub { color: var(--text2); font-size: 13px; margin: 0 0 12px; }
.tabs { display: flex; gap: 6px; margin: 16px 0; flex-wrap: wrap; }
.tabs button, .seg button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text2); cursor: pointer; }
.tabs button[aria-selected=true], .seg button[aria-pressed=true] { background: var(--text); color: var(--surface); border-color: var(--text); }
.filters { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters label { color: var(--text2); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.seg { display: flex; gap: 4px; }
.seg button { padding: 4px 12px; }
select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.kpi b { display: block; font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--text2); font-size: 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text2); margin: 4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.chart { position: relative; width: 100%; }
svg { display: block; width: 100%; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg text.lbl { fill: var(--text2); }
svg text.name { fill: var(--text); font-size: 12px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.14);
  white-space: nowrap; z-index: 5; display: none; font-variant-numeric: tabular-nums; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; }
.half { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 860px) { .split, .half { grid-template-columns: minmax(0, 1fr); } }
.tablewrap { max-height: 430px; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--surface); text-align: left; color: var(--text2);
  font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
tbody tr.pick { cursor: pointer; }
tbody tr.pick:hover { background: var(--grid); }
tbody tr.on { background: var(--sel); }
td.num, th.num { text-align: right; }
.pos::before { content: "▲ "; color: var(--good); font-size: 9px; }
.neg::before { content: "▼ "; color: var(--bad); font-size: 9px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--text2); margin: 6px 0 8px; }
.facts b { color: var(--text); font-weight: 600; }
.empty { color: var(--text2); padding: 28px 8px; text-align: center; }
.events { max-height: 300px; overflow: auto; font-size: 12.5px; }
.events div { padding: 5px 2px; border-bottom: 1px solid var(--grid); }
.events time { color: var(--muted); margin-right: 8px; }
.note { color: var(--text2); font-size: 12.5px; margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>形態交易統計</h1>
  <p class="sub" id="meta"></p>
  <div class="tabs" role="tablist">
    <button role="tab" data-k="history">2018 至今回測</button>
    <button role="tab" data-k="paper">模擬交易（實測中）</button>
  </div>
  <div id="view"></div>
</main>
<script>
const DATA = /*DATA*/null;
const $ = (s, r = document) => r.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const txt = (parent, x, y, s, attrs = {}) => { const t = el("text", { x, y, ...attrs }, parent); t.textContent = s; return t; };
const tpe = t => new Date(t + 8 * 3600e3).toISOString();
const fmtD = t => tpe(t).slice(0, 10);
const fmtDT = t => tpe(t).slice(5, 16).replace("T", " ");
const fmtP = v => v >= 1000 ? v.toLocaleString("en-US", { maximumFractionDigits: 1 }) : v >= 1 ? v.toFixed(3) : v.toPrecision(4);
const sgn = (v, d = 1) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
const fmtR = (v, d = 2) => sgn(v, d) + "R";
const fmtM = v => (v >= 0 ? "+" : "−") + Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
const cls = v => v >= 0 ? "pos" : "neg";
const yearOf = t => new Date(t).getUTCFullYear();
const C = { long: "var(--long)", short: "var(--short)", all: "var(--text)" };
const SIDE = { LONG: "做多", SHORT: "做空" };
const TF = 14400000;

function ticks(lo, hi, n) {
  const span = hi - lo || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function frame(host, h) {
  host.innerHTML = "";
  const w = Math.max(260, host.clientWidth);
  const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, height: h }, host);
  const tip = document.createElement("div"); tip.className = "tip"; host.appendChild(tip);
  const show = (html, x, y) => {
    tip.innerHTML = html; tip.style.display = "block";
    tip.style.left = Math.min(Math.max(0, x + 12), w - tip.offsetWidth) + "px";
    tip.style.top = Math.max(0, y - tip.offsetHeight - 10) + "px";
  };
  return { svg, w, show, hide: () => tip.style.display = "none" };
}
function yAxis(svg, w, m, lo, hi, h, fmt) {
  const y = v => m.t + (hi - v) / (hi - lo) * (h - m.t - m.b);
  for (const v of ticks(lo, hi, 4)) {
    el("line", { x1: m.l, x2: w - m.r, y1: y(v), y2: y(v), stroke: "var(--grid)" }, svg);
    txt(svg, m.l - 6, y(v) + 4, fmt(v), { "text-anchor": "end" });
  }
  return y;
}

/* ---------- cumulative R over time ---------- */
function cumChart(host, series) {
  const h = 260, m = { l: 52, r: 86, t: 10, b: 24 };
  const { svg, w, show, hide } = frame(host, h);
  const all = series.flatMap(s => s.pts);
  if (!all.length) { host.innerHTML = '<div class="empty">沒有符合條件的交易。</div>'; return; }
  const t0 = Math.min(...series.map(s => s.pts[0][0])), t1 = Math.max(...series.map(s => s.pts.at(-1)[0]));
  let lo = Math.min(0, ...all.map(p => p[1])), hi = Math.max(0, ...all.map(p => p[1]));
  const pad = (hi - lo || 10) * 0.06; lo -= pad; hi += pad;
  const x = t => m.l + (t - t0) / (t1 - t0 || 1) * (w - m.l - m.r);
  const y = yAxis(svg, w, m, lo, hi, h, v => v + "R");
  el("line", { x1: m.l, x2: w - m.r, y1: y(0), y2: y(0), stroke: "var(--muted)" }, svg);
  for (let yr = yearOf(t0) + 1; yr <= yearOf(t1); yr++) {
    const tx = Date.UTC(yr, 0, 1);
    el("line", { x1: x(tx), x2: x(tx), y1: h - m.b, y2: h - m.b + 4, stroke: "var(--muted)" }, svg);
    txt(svg, x(tx), h - 6, yr, { "text-anchor": "middle" });
  }
  const ends = [];
  for (const s of series) {
    let d = "";
    s.pts.forEach((p, j) => { d += (j ? "L" : "M") + x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1); });
    el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    const last = s.pts.at(-1);
    el("circle", { cx: x(last[0]), cy: y(last[1]), r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2 }, svg);
    ends.push({ y: y(last[1]), name: s.name, v: last[1] });
  }
  ends.sort((a, b) => a.y - b.y).forEach((e, i, a) => { if (i && e.y - a[i - 1].y < 26) e.y = a[i - 1].y + 26; });
  ends.forEach(e => { txt(svg, w - m.r + 10, e.y, e.name, { class: "lbl" }); txt(svg, w - m.r + 10, e.y + 12, fmtR(e.v, 0)); });
  const cross = el("line", { y1: m.t, y2: h - m.b, stroke: "var(--muted)", visibility: "hidden" }, svg);
  const hit = el("rect", { x: m.l, y: m.t, width: w - m.l - m.r, height: h - m.t - m.b, fill: "transparent" }, svg);
  hit.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * w / r.width;
    const t = t0 + (px - m.l) / (w - m.l - m.r) * (t1 - t0);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    const rows = series.map(s => {
      let a = 0, b = s.pts.length - 1;
      while (a < b) { const c = (a + b + 1) >> 1; if (s.pts[c][0] <= t) a = c; else b = c - 1; }
      const v = s.pts[a][0] <= t ? s.pts[a][1] : 0;
      return `<div><i style="background:${s.color}"></i>${s.name} <b>${fmtR(v, 1)}</b></div>`;
    });
    show(`<div style="color:var(--muted)">${fmtD(t)}</div>${rows.join("")}`, px, ev.clientY - r.top);
  });
  hit.addEventListener("mouseleave", () => { hide(); cross.setAttribute("visibility", "hidden"); });
}

/* ---------- yearly bars ---------- */
function yearBars(host, years, groups) {
  const h = 230, m = { l: 52, r: 12, t: 10, b: 24 };
  const { svg, w, show, hide } = frame(host, h);
  const vals = groups.flatMap(g => years.map(yr => g.by[yr] ? g.by[yr].r : 0));
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const pad = (hi - lo || 10) * 0.08; lo -= pad; hi += pad;
  const y = yAxis(svg, w, m, lo, hi, h, v => v + "R");
  const slot = (w - m.l - m.r) / years.length, bw = Math.min(26, (slot - 10) / groups.length - 2);
  years.forEach((yr, i) => {
    const cx = m.l + slot * (i + 0.5), x0 = cx - (groups.length * (bw + 2) - 2) / 2;
    groups.forEach((g, j) => {
      const v = g.by[yr] ? g.by[yr].r : 0;
      el("rect", { x: x0 + j * (bw + 2), y: Math.min(y(v), y(0)), width: bw, height: Math.max(1, Math.abs(y(v) - y(0))), rx: 3, fill: g.color }, svg);
    });
    txt(svg, cx, h - 6, yr, { "text-anchor": "middle" });
    const hit = el("rect", { x: cx - slot / 2, y: m.t, width: slot, height: h - m.t - m.b, fill: "transparent" }, svg);
    hit.addEventListener("mousemove", ev => {
      const r = svg.getBoundingClientRect();
      show(`<div style="color:var(--muted)">${yr} 年</div>` + groups.map(g => { const b = g.by[yr] || { r: 0, n: 0 }; return `<div><i style="background:${g.color}"></i>${g.name} <b>${fmtR(b.r, 1)}</b>（${b.n} 筆）</div>`; }).join(""), cx, ev.clientY - r.top);
    });
    hit.addEventListener("mouseleave", hide);
  });
  el("line", { x1: m.l, x2: w - m.r, y1: y(0), y2: y(0), stroke: "var(--muted)" }, svg);
}

/* ---------- horizontal bars per pattern / coin ---------- */
function hBars(host, items, selected, onPick) {
  const rowH = 24, m = { l: 108, r: 58, t: 4, b: 4 }, h = items.length * rowH + m.t + m.b;
  const { svg, w, show, hide } = frame(host, h);
  const lo = Math.min(0, ...items.map(d => d.r)), hi = Math.max(0, ...items.map(d => d.r));
  const x = v => m.l + (v - lo) / (hi - lo || 1) * (w - m.l - m.r);
  items.forEach((d, i) => {
    const cy = m.t + i * rowH + rowH / 2;
    if (d.key === selected) el("rect", { x: 0, y: cy - rowH / 2, width: w, height: rowH, fill: "var(--sel)" }, svg);
    txt(svg, m.l - 8, cy + 4, d.label, { "text-anchor": "end", class: "name" });
    el("rect", { x: Math.min(x(d.r), x(0)), y: cy - 7, width: Math.max(1, Math.abs(x(d.r) - x(0))), height: 14, rx: 3, fill: d.color }, svg);
    txt(svg, d.r >= 0 ? x(d.r) + 6 : x(d.r) - 6, cy + 4, fmtR(d.r, 0), { class: "lbl", "text-anchor": d.r >= 0 ? "start" : "end" });
    const hit = el("rect", { x: 0, y: cy - rowH / 2, width: w, height: rowH, fill: "transparent", style: onPick ? "cursor:pointer" : "" }, svg);
    hit.addEventListener("mousemove", ev => { const r = svg.getBoundingClientRect(); show(`<b>${d.label}</b><div>${d.n} 筆，勝率 ${d.win.toFixed(1)}%</div><div>合計 <b>${fmtR(d.r, 1)}</b>，每筆 ${fmtR(d.r / d.n)}</div>`, (ev.clientX - r.left) * w / r.width, ev.clientY - r.top); });
    hit.addEventListener("mouseleave", hide);
    if (onPick) hit.addEventListener("click", () => onPick(d.key));
  });
  el("line", { x1: x(0), x2: x(0), y1: m.t, y2: h - m.b, stroke: "var(--muted)" }, svg);
}

/* ---------- candles around one paper trade or open position ---------- */
const is4 = o => (o.account || o.pattern || "").includes("四段");
const tgtText = o => o.target != null ? fmtP(o.target) : is4(o) ? "1R、2R、3R 各出 25%" + (o.tp_hit != null ? `（已出 ${o.tp_hit} 段）` : "") : "移動止損";
const tpLevels = o => { if (!is4(o)) return []; const s = o.side === "LONG" ? 1 : -1, risk = Math.abs(o.entry - (o.stop0 ?? o.stop)); return [1, 2, 3].map(k => o.entry + s * k * risk); };
const TFMS = { "4H": 14400000, "8H": 28800000, "12H": 43200000, "日線": 86400000 };
function candleChart(host, t, tfn) {
  const h = 330, m = { l: 62, r: 108, t: 12, b: 24 }, ms = TFMS[tfn] || TF;
  const { svg, w, show, hide } = frame(host, h);
  const cs = Array.isArray(t.candles) ? t.candles : (t.candles[tfn] || []);
  if (!cs.length) { host.innerHTML = '<div class="empty">這個週期沒有足夠的 K 線資料。</div>'; return; }
  const moved = t.stop0 != null && t.stop0 !== t.stop;
  const tps = tpLevels(t);
  const lv = [t.stop, t.entry, t.exit, t.target, moved ? t.stop0 : null, ...tps].filter(v => v != null);
  let lo = Math.min(...lv, ...cs.map(c => c[3])), hi = Math.max(...lv, ...cs.map(c => c[2]));
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const y = yAxis(svg, w, m, lo, hi, h, fmtP);
  const slot = (w - m.l - m.r) / cs.length, bw = Math.max(1.5, slot * 0.62);
  const xi = i => m.l + slot * (i + 0.5);
  const idx = tt => cs.findIndex(c => c[0] + ms >= tt);
  const iE = Math.max(0, idx(t.t_entry));
  const iX = t.t_exit == null || idx(t.t_exit) < 0 ? cs.length - 1 : Math.max(iE, idx(t.t_exit));
  el("rect", { x: xi(iE) - slot / 2, y: m.t, width: slot * (iX - iE + 1), height: h - m.t - m.b, fill: "var(--band)" }, svg);
  cs.forEach((c, i) => {
    const up = c[4] >= c[1], col = up ? "var(--up)" : "var(--down)";
    el("line", { x1: xi(i), x2: xi(i), y1: y(c[2]), y2: y(c[3]), stroke: col }, svg);
    el("rect", { x: xi(i) - bw / 2, y: y(Math.max(c[1], c[4])), width: bw, height: Math.max(1, Math.abs(y(c[1]) - y(c[4]))), fill: up ? "var(--surface)" : col, stroke: col }, svg);
  });
  const lines = [{ v: t.entry, s: "進場", c: "var(--text)", d: "" }, { v: t.stop, s: moved ? "目前止損" : "止損", c: "var(--bad)", d: "4 3" },
                 { v: moved ? t.stop0 : null, s: "原止損", c: "var(--muted)", d: "2 4" },
                 { v: t.target, s: "目標", c: "var(--good)", d: "4 3" }, { v: t.exit, s: "出場", c: "var(--long)", d: "1 3" },
                 ...tps.map((v, k) => ({ v, s: `停利${k + 1}`, c: "var(--good)", d: "4 3" }))]
    .filter(l => l.v != null).map(l => ({ ...l, ly: y(l.v) })).sort((a, b) => a.ly - b.ly);
  lines.forEach((l, i) => { if (i && l.ly - lines[i - 1].ly < 13) l.ly = lines[i - 1].ly + 13; });
  for (const l of lines) {
    el("line", { x1: xi(iE) - slot / 2, x2: w - m.r, y1: y(l.v), y2: y(l.v), stroke: l.c, "stroke-width": 1.5, "stroke-dasharray": l.d }, svg);
    txt(svg, w - m.r + 6, l.ly + 4, `${l.s} ${fmtP(l.v)}`, { class: "lbl" });
  }
  const step = Math.ceil(cs.length / 6), lab = c => ms >= 86400000 ? fmtD(c[0]).slice(5) : fmtDT(c[0]);
  cs.forEach((c, i) => { if (i % step === 0) txt(svg, xi(i), h - 6, lab(c), { "text-anchor": "middle" }); });
  const cross = el("line", { y1: m.t, y2: h - m.b, stroke: "var(--muted)", visibility: "hidden" }, svg);
  const hit = el("rect", { x: m.l, y: m.t, width: w - m.l - m.r, height: h - m.t - m.b, fill: "transparent" }, svg);
  hit.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * w / r.width;
    const i = Math.min(cs.length - 1, Math.max(0, Math.floor((px - m.l) / slot))), c = cs[i];
    cross.setAttribute("x1", xi(i)); cross.setAttribute("x2", xi(i)); cross.setAttribute("visibility", "visible");
    show(`<div style="color:var(--muted)">${fmtDT(c[0])}（${tfn} K 棒）</div>開 ${fmtP(c[1])}　高 ${fmtP(c[2])}<br>低 ${fmtP(c[3])}　收 <b>${fmtP(c[4])}</b>`, xi(i), ev.clientY - r.top);
  });
  hit.addEventListener("mouseleave", () => { hide(); cross.setAttribute("visibility", "hidden"); });
}
/* timeframe buttons + chart; the trade's own timeframe is marked and shown first */
function showChart(segEl, host, t, tfn) {
  const own = t.timeframe || "4H";
  tfn = tfn || own;
  segEl.innerHTML = Object.keys(TFMS).map(n => `<button data-tf="${n}" aria-pressed="${n === tfn}">${n}${n === own ? "（進場週期）" : ""}</button>`).join("");
  segEl.querySelectorAll("button").forEach(b => b.addEventListener("click", () => showChart(segEl, host, t, b.dataset.tf)));
  candleChart(host, t, tfn);
}
const btText = o => o.bt ? `<span>這個組合的回測（2018 至今）：<b>${o.bt[0]}</b> 筆，合計 <b class="${cls(o.bt[1])}">${fmtR(o.bt[1], 1)}</b></span>` : "<span>這個組合在回測裡沒有交易</span>";
const CHART_LEGEND = `<div class="legend"><span><i style="border:1.5px solid var(--up)"></i>上漲 K 棒</span><span><i style="background:var(--down)"></i>下跌 K 棒</span><span><i style="background:var(--band);border:1px solid var(--long)"></i>持倉期間</span></div>`;

      }</tbody></table></div></div>
    <div class="half">
      <div class="card"><h2>各形態模擬帳戶</h2><div class="tablewrap"><table>
        <thead><tr><th>帳戶</th><th>方向</th><th class="num">筆數</th><th class="num">合計</th><th class="num">權益 USDT</th></tr></thead><tbody>${accRows || '<tr><td colspan="5" class="empty">尚無資料</td></tr>'}</tbody></table></div></div>
      <div class="card"><h2>最近的進出場</h2><p class="sub">最新的在最上面。</p><div class="events">${events}</div></div>
    </div>`;
  if (P._flat && P._flat.length && $("#ptb")) {
    const pickP = i => { const p = P._flat[i];
      $("#pt").textContent = `${p.symbol} ${p.account}（${SIDE[p.side]}，持倉中）· 進場 ${fmtDT(p.t_entry)}`;
      $("#pf").innerHTML = `<span>進場 <b>${fmtP(p.entry)}</b></span><span>現價 <b>${fmtP(p.last)}</b></span><span>目前止損 <b>${fmtP(p.stop)}</b>${p.stop !== p.stop0 ? `（原本 ${fmtP(p.stop0)}）` : ""}</span><span>目標 <b>${tgtText(p)}</b></span><span>浮動損益 <b class="${cls(p.R)}">${fmtR(p.R)}</b></span>${p.crowding != null ? `<span>資金費率擁擠度 <b>${sgn(p.crowding, 3)}%</b></span>` : ""}${p.crowding != null && p.funding_R != null ? `<span>資金費率累計 <b>${fmtR(-p.funding_R)}</b>（正數是收到，負數是付出）</span>` : ""}${btText(p)}${p.neg_combo ? "<span>屬於回測為負的組合</span>" : ""}`;
      showChart($("#pcseg"), $("#pc"), { ...p, t_exit: null, exit: null });
      document.querySelectorAll("#ptb tr").forEach(r => r.classList.toggle("on", +r.dataset.i === i)); };
    $("#ptb").addEventListener("click", e => { const r = e.target.closest("tr"); if (r) pickP(+r.dataset.i); });
    pickP(0);
  }
  if (!T.length) return;
  $("#tb").innerHTML = T.map((t, i) => `<tr class="pick" data-i="${i}"><td>${fmtDT(t.t_entry)}</td><td>${t.symbol.replace("USDT", "")}</td><td>${t.pattern}</td><td>${SIDE[t.side]}</td><td class="num">${t.breadth ?? ""}</td><td class="num"><span class="${cls(t.R_net)}">${fmtR(t.R_net)}</span></td><td>${t.reason}</td></tr>`).reverse().join("");
  const pickT = i => { const t = T[i];
    $("#tt").textContent = `${t.symbol} ${t.pattern}（${SIDE[t.side]}）· ${fmtD(t.t_entry)}`;
    $("#tf").innerHTML = `<span>進場 <b>${fmtP(t.entry)}</b></span><span>止損 <b>${fmtP(t.stop)}</b></span><span>目標 <b>${tgtText(t)}</b></span><span>出場 <b>${fmtP(t.exit)}</b>（${t.reason}）</span><span>結果 <b class="${cls(t.R_net)}">${fmtR(t.R_net)}</b></span><span>損益 <b>${fmtM(t.pnl)}</b> USDT</span><span>${+t.volume_confirmed ? "突破有放量" : "突破未放量"}</span>${t.breadth != null && t.breadth !== "" ? `<span>同方向強勢訊號的商品 <b>${t.breadth}</b> 個</span>` : ""}${t.crowding != null ? `<span>資金費率擁擠度 <b>${sgn(t.crowding, 3)}%</b></span>` : ""}${t.crowding != null && t.funding_R != null ? `<span>資金費率 <b>${fmtR(-t.funding_R)}</b>（正數是收到，負數是付出）</span>` : ""}${btText(t)}${t.neg_combo ? "<span>屬於回測為負的組合</span>" : ""}`;
    showChart($("#ccseg"), $("#cc"), t);
    document.querySelectorAll("#tb tr").forEach(r => r.classList.toggle("on", +r.dataset.i === i)); };
  $("#tb").addEventListener("click", e => { const r = e.target.closest("tr"); if (r) pickT(+r.dataset.i); });
  pickT(T.length - 1);
}

$("#meta").textContent = `16 種 K 線形態，以 4 小時線為主，強勢版另有 8 小時、12 小時、日線。共 ${N_ALL} 個商品。資料產生於 ${fmtDT(DATA.generated)}（台北時間）。全部是回測或模擬資金，沒有真實下單。`;
let current = DATA.paper.positions_updated ? "paper" : "history";      // open on the live paper test when it is running
const render = k => { current = k; document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.k === k)); (k === "history" ? renderHistory : renderPaper)(); };
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => render(b.dataset.k)));
render(current);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => render(current), 150); });
</script>
</body>
</html>
