<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>形態交易統計</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --border: #e3e1db; --grid: #ebe9e4;
  --text: #0b0b0b; --text2: #52514e; --muted: #85837d;
  --long: #2a78d6; --short: #eb6834;
  --up: #1baf7a; --down: #e34948; --good: #0ca30c; --bad: #d03b3b;
  --band: rgba(42,120,214,.09); --sel: rgba(42,120,214,.12);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #33332f; --grid: #2a2a27;
    --text: #f0efec; --text2: #c3c2b7; --muted: #8d8c84;
    --long: #3987e5; --short: #d95926;
    --up: #199e70; --down: #e66767; --band: rgba(57,135,229,.14); --sel: rgba(57,135,229,.2);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 2px; }
h2 { font-size: 15px; margin: 0 0 2px; }
.sub { color: var(--text2); font-size: 13px; margin: 0 0 12px; }
.tabs { display: flex; gap: 6px; margin: 16px 0; flex-wrap: wrap; }
.tabs button, .seg button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text2); cursor: pointer; }
.tabs button[aria-selected=true], .seg button[aria-pressed=true] { background: var(--text); color: var(--surface); border-color: var(--text); }
.filters { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters label { color: var(--text2); font-size: 13px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.filters label .seg { white-space: normal; }
.seg { display: flex; gap: 4px; }
.seg button { padding: 4px 12px; }
select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.kpi b { display: block; font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--text2); font-size: 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text2); margin: 4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.chart { position: relative; width: 100%; }
svg { display: block; width: 100%; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg text.lbl { fill: var(--text2); }
svg text.name { fill: var(--text); font-size: 12px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.14);
  white-space: nowrap; z-index: 5; display: none; font-variant-numeric: tabular-nums; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; }
.half { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 860px) { .split, .half { grid-template-columns: minmax(0, 1fr); } }
.tablewrap { max-height: 430px; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th { position: sticky; top: 0; background: var(--surface); text-align: left; color: var(--text2);
  font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
tbody tr.pick { cursor: pointer; }
tbody tr.pick:hover { background: var(--grid); }
tbody tr.on { background: var(--sel); }
td.num, th.num { text-align: right; }
.pos::before { content: "▲ "; color: var(--good); font-size: 9px; }
.neg::before { content: "▼ "; color: var(--bad); font-size: 9px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--text2); margin: 6px 0 8px; }
.facts b { color: var(--text); font-weight: 600; }
.empty { color: var(--text2); padding: 28px 8px; text-align: center; }
.events { max-height: 300px; overflow: auto; font-size: 12.5px; }
.events div { padding: 5px 2px; border-bottom: 1px solid var(--grid); }
.events time { color: var(--muted); margin-right: 8px; }
.note { color: var(--text2); font-size: 12.5px; margin: 8px 0 0; }

/* ---------- layout added with the redesign ---------- */
main { max-width: 1180px; padding-top: 18px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px 14px; flex-wrap: wrap; }
.top .sub { margin: 0; }
.badge { font-size: 12px; color: var(--text2); border: 1px solid var(--border); background: var(--surface);
  border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
.badge i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; }
.tabs { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 10px 0; margin: 10px 0 12px;
  border-bottom: 1px solid var(--border); }
.tabs button { font-weight: 600; }
.subnav { margin: 0 0 14px; flex-wrap: wrap; }
.seg { flex-wrap: wrap; }
button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--long); outline-offset: 2px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); }
.kpi { display: flex; flex-direction: column; gap: 1px; }
.kpi span { order: -1; }
.kpi b { font-size: 22px; line-height: 1.25; }
.kpi small { color: var(--muted); font-size: 11.5px; }
.card.filters { padding: 12px 14px; }
.card h2 + .sub { margin-top: 2px; }
details.about { margin: 0 0 12px; font-size: 13px; color: var(--text2); }
details.about summary { cursor: pointer; display: inline-block; padding: 2px 0; color: var(--text2); }
details.about p { margin: 6px 0 0; max-width: 78ch; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 400; color: var(--text2);
  border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; line-height: 19px; vertical-align: 1px; }
.chip i { width: 7px; height: 7px; border-radius: 50%; }
.md { display: grid; grid-template-columns: minmax(280px, 370px) minmax(0, 1fr); gap: 14px; align-items: start; }
.md .list { order: -1; padding: 6px; max-height: 660px; overflow: auto; }
.md .detail { margin-bottom: 0; scroll-margin-top: 64px; }
@media (max-width: 860px) { .md { grid-template-columns: minmax(0, 1fr); } .md .list { max-height: none; } }
.grp { display: flex; gap: 10px; align-items: baseline; padding: 10px 10px 4px; font-size: 12px; color: var(--text2);
  border-top: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
.grp:first-child { border-top: 0; }
.grp b { font-size: 14px; color: var(--text); }
.grp .r { margin-left: auto; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; width: 100%; text-align: left; font: inherit;
  color: inherit; background: none; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.item:hover { background: var(--grid); }
.item[aria-current=true] { background: var(--sel); }
.item .l1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .l2 { grid-column: 1; color: var(--text2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .r { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.facts2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px 14px; margin: 10px 0 12px; }
.facts2 dt { font-size: 11.5px; color: var(--muted); }
.facts2 dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.facts2 dd small { display: block; font-weight: 400; color: var(--text2); font-size: 11.5px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 0; }
td small { display: block; color: var(--muted); font-size: 11px; }
td.dim { color: var(--muted); }
.tablewrap.free { max-height: none; }
.matrix th.g { text-align: center; border-left: 1px solid var(--border); }
.matrix td.g, .matrix th.gl { border-left: 1px solid var(--border); }
.matrix td:first-child, .matrix th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.matrix tfoot td { font-weight: 600; border-top: 1px solid var(--border); border-bottom: 0; }
.toolbar { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; color: var(--text2); font-size: 13px; }
.toolbar label { display: flex; gap: 6px; align-items: center; }
@media (max-width: 520px) { main { padding: 14px 12px 40px; } h1 { font-size: 19px; } .card { padding: 13px; } .kpi b { font-size: 19px; } }
@media (prefers-color-scheme: dark) { :root { --good: #35b85c; --bad: #ef6a6a; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <div><h1>形態交易統計</h1><p class="sub" id="meta"></p></div>
    <span class="badge"><i></i>模擬資金 · 沒有真實下單</span>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" data-k="paper">模擬交易（實測中）</button>
    <button role="tab" data-k="history">2018 至今回測</button>
  </div>
  <div id="view"></div>
</main>
<script>
const DATA = /*DATA*/null;
const $ = (s, r = document) => r.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const txt = (parent, x, y, s, attrs = {}) => { const t = el("text", { x, y, ...attrs }, parent); t.textContent = s; return t; };
const tpe = t => new Date(t + 8 * 3600e3).toISOString();
const fmtD = t => tpe(t).slice(0, 10);
const fmtDT = t => tpe(t).slice(5, 16).replace("T", " ");
const fmtP = v => v >= 1000 ? v.toLocaleString("en-US", { maximumFractionDigits: 1 }) : v >= 1 ? v.toFixed(3) : v.toPrecision(4);
const sgn = (v, d = 1) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
const fmtR = (v, d = 2) => sgn(v, d) + "R";
const fmtM = v => (v >= 0 ? "+" : "−") + Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
const cls = v => v >= 0 ? "pos" : "neg";
const yearOf = t => new Date(t).getUTCFullYear();
const C = { long: "var(--long)", short: "var(--short)", all: "var(--text)" };
const SIDE = { LONG: "做多", SHORT: "做空" };
const TF = 14400000;

function ticks(lo, hi, n) {
  const span = hi - lo || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function frame(host, h) {
  host.innerHTML = "";
  const w = Math.max(260, host.clientWidth);
  const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, height: h }, host);
  const tip = document.createElement("div"); tip.className = "tip"; host.appendChild(tip);
  const show = (html, x, y) => {
    tip.innerHTML = html; tip.style.display = "block";
    tip.style.left = Math.min(Math.max(0, x + 12), w - tip.offsetWidth) + "px";
    tip.style.top = Math.max(0, y - tip.offsetHeight - 10) + "px";
  };
  return { svg, w, show, hide: () => tip.style.display = "none" };
}
function yAxis(svg, w, m, lo, hi, h, fmt) {
  const y = v => m.t + (hi - v) / (hi - lo) * (h - m.t - m.b);
  for (const v of ticks(lo, hi, 4)) {
    el("line", { x1: m.l, x2: w - m.r, y1: y(v), y2: y(v), stroke: "var(--grid)" }, svg);
    txt(svg, m.l - 6, y(v) + 4, fmt(v), { "text-anchor": "end" });
  }
  return y;
}

/* ---------- cumulative R over time ---------- */
function cumChart(host, series) {
  const h = 260, m = { l: 52, r: 86, t: 10, b: 24 };
  const { svg, w, show, hide } = frame(host, h);
  const all = series.flatMap(s => s.pts);
  if (!all.length) { host.innerHTML = '<div class="empty">沒有符合條件的交易。</div>'; return; }
  const t0 = Math.min(...series.map(s => s.pts[0][0])), t1 = Math.max(...series.map(s => s.pts.at(-1)[0]));
  let lo = Math.min(0, ...all.map(p => p[1])), hi = Math.max(0, ...all.map(p => p[1]));
  const pad = (hi - lo || 10) * 0.06; lo -= pad; hi += pad;
  const x = t => m.l + (t - t0) / (t1 - t0 || 1) * (w - m.l - m.r);
  const y = yAxis(svg, w, m, lo, hi, h, v => v + "R");
  el("line", { x1: m.l, x2: w - m.r, y1: y(0), y2: y(0), stroke: "var(--muted)" }, svg);
  for (let yr = yearOf(t0) + 1; yr <= yearOf(t1); yr++) {
    const tx = Date.UTC(yr, 0, 1);
    el("line", { x1: x(tx), x2: x(tx), y1: h - m.b, y2: h - m.b + 4, stroke: "var(--muted)" }, svg);
    txt(svg, x(tx), h - 6, yr, { "text-anchor": "middle" });
  }
  if (yearOf(t0) === yearOf(t1)) { txt(svg, m.l, h - 6, fmtD(t0)); txt(svg, w - m.r, h - 6, fmtD(t1), { "text-anchor": "end" }); }
  const ends = [];
  for (const s of series) {
    let d = "";
    s.pts.forEach((p, j) => { d += (j ? "L" : "M") + x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1); });
    el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round" }, svg);
    const last = s.pts.at(-1);
    el("circle", { cx: x(last[0]), cy: y(last[1]), r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2 }, svg);
    ends.push({ y: y(last[1]), name: s.name, v: last[1] });
  }
  ends.sort((a, b) => a.y - b.y).forEach((e, i, a) => { if (i && e.y - a[i - 1].y < 26) e.y = a[i - 1].y + 26; });
  ends.forEach(e => { txt(svg, w - m.r + 10, e.y, e.name, { class: "lbl" }); txt(svg, w - m.r + 10, e.y + 12, fmtR(e.v, 0)); });
  const cross = el("line", { y1: m.t, y2: h - m.b, stroke: "var(--muted)", visibility: "hidden" }, svg);
  const hit = el("rect", { x: m.l, y: m.t, width: w - m.l - m.r, height: h - m.t - m.b, fill: "transparent" }, svg);
  hit.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * w / r.width;
    const t = t0 + (px - m.l) / (w - m.l - m.r) * (t1 - t0);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    const rows = series.map(s => {
      let a = 0, b = s.pts.length - 1;
      while (a < b) { const c = (a + b + 1) >> 1; if (s.pts[c][0] <= t) a = c; else b = c - 1; }
      const v = s.pts[a][0] <= t ? s.pts[a][1] : 0;
      return `<div><i style="background:${s.color}"></i>${s.name} <b>${fmtR(v, 1)}</b></div>`;
    });
    show(`<div style="color:var(--muted)">${fmtD(t)}</div>${rows.join("")}`, px, ev.clientY - r.top);
  });
  hit.addEventListener("mouseleave", () => { hide(); cross.setAttribute("visibility", "hidden"); });
}

/* ---------- yearly bars ---------- */
function yearBars(host, years, groups) {
  const h = 230, m = { l: 52, r: 12, t: 10, b: 24 };
  const { svg, w, show, hide } = frame(host, h);
  const vals = groups.flatMap(g => years.map(yr => g.by[yr] ? g.by[yr].r : 0));
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const pad = (hi - lo || 10) * 0.08; lo -= pad; hi += pad;
  const y = yAxis(svg, w, m, lo, hi, h, v => v + "R");
  const slot = (w - m.l - m.r) / years.length, bw = Math.min(26, (slot - 10) / groups.length - 2);
  years.forEach((yr, i) => {
    const cx = m.l + slot * (i + 0.5), x0 = cx - (groups.length * (bw + 2) - 2) / 2;
    groups.forEach((g, j) => {
      const v = g.by[yr] ? g.by[yr].r : 0;
      el("rect", { x: x0 + j * (bw + 2), y: Math.min(y(v), y(0)), width: bw, height: Math.max(1, Math.abs(y(v) - y(0))), rx: 3, fill: g.color }, svg);
    });
    txt(svg, cx, h - 6, yr, { "text-anchor": "middle" });
    const hit = el("rect", { x: cx - slot / 2, y: m.t, width: slot, height: h - m.t - m.b, fill: "transparent" }, svg);
    hit.addEventListener("mousemove", ev => {
      const r = svg.getBoundingClientRect();
      show(`<div style="color:var(--muted)">${yr} 年</div>` + groups.map(g => { const b = g.by[yr] || { r: 0, n: 0 }; return `<div><i style="background:${g.color}"></i>${g.name} <b>${fmtR(b.r, 1)}</b>（${b.n} 筆）</div>`; }).join(""), cx, ev.clientY - r.top);
    });
    hit.addEventListener("mouseleave", hide);
  });
  el("line", { x1: m.l, x2: w - m.r, y1: y(0), y2: y(0), stroke: "var(--muted)" }, svg);
}

/* ---------- horizontal bars per pattern / coin ---------- */
function hBars(host, items, selected, onPick) {
  const rowH = 24, m = { l: 108, r: 58, t: 4, b: 4 }, h = items.length * rowH + m.t + m.b;
  const { svg, w, show, hide } = frame(host, h);
  const lo = Math.min(0, ...items.map(d => d.r)), hi = Math.max(0, ...items.map(d => d.r));
  const x = v => m.l + (v - lo) / (hi - lo || 1) * (w - m.l - m.r);
  items.forEach((d, i) => {
    const cy = m.t + i * rowH + rowH / 2;
    if (d.key === selected) el("rect", { x: 0, y: cy - rowH / 2, width: w, height: rowH, fill: "var(--sel)" }, svg);
    txt(svg, m.l - 8, cy + 4, d.label, { "text-anchor": "end", class: "name" });
    el("rect", { x: Math.min(x(d.r), x(0)), y: cy - 7, width: Math.max(1, Math.abs(x(d.r) - x(0))), height: 14, rx: 3, fill: d.color }, svg);
    txt(svg, d.r >= 0 ? x(d.r) + 6 : x(d.r) - 6, cy + 4, fmtR(d.r, 0), { class: "lbl", "text-anchor": d.r >= 0 ? "start" : "end" });
    const hit = el("rect", { x: 0, y: cy - rowH / 2, width: w, height: rowH, fill: "transparent", style: onPick ? "cursor:pointer" : "" }, svg);
    hit.addEventListener("mousemove", ev => { const r = svg.getBoundingClientRect(); show(`<b>${d.label}</b><div>${d.n} 筆，勝率 ${d.win.toFixed(1)}%</div><div>合計 <b>${fmtR(d.r, 1)}</b>，每筆 ${fmtR(d.r / d.n)}</div>`, (ev.clientX - r.left) * w / r.width, ev.clientY - r.top); });
    hit.addEventListener("mouseleave", hide);
    if (onPick) hit.addEventListener("click", () => onPick(d.key));
  });
  el("line", { x1: x(0), x2: x(0), y1: m.t, y2: h - m.b, stroke: "var(--muted)" }, svg);
}

/* ---------- candles around one paper trade or open position ---------- */
const is4 = o => (o.account || o.pattern || "").includes("四段");
const tgtText = o => o.target != null ? fmtP(o.target) : is4(o) ? "1R、2R、3R 各出 25%" + (o.tp_hit != null ? `（已出 ${o.tp_hit} 段）` : "") : "移動止損";
const tpLevels = o => { if (!is4(o)) return []; const s = o.side === "LONG" ? 1 : -1, risk = Math.abs(o.entry - (o.stop0 ?? o.stop)); return [1, 2, 3].map(k => o.entry + s * k * risk); };
const TFMS = { "4H": 14400000, "8H": 28800000, "12H": 43200000, "日線": 86400000 };
function candleChart(host, t, tfn) {
  const h = 330, m = { l: 62, r: 108, t: 12, b: 24 }, ms = TFMS[tfn] || TF;
  const { svg, w, show, hide } = frame(host, h);
  const cs = Array.isArray(t.candles) ? t.candles : (t.candles[tfn] || []);
  if (!cs.length) { host.innerHTML = '<div class="empty">這個週期沒有足夠的 K 線資料。</div>'; return; }
  const moved = t.stop0 != null && t.stop0 !== t.stop;
  const tps = tpLevels(t);

        ${groupTable([["回測為負的組合", T.filter(t => t.neg_combo)], ["其餘組合", T.filter(t => !t.neg_combo)],
          ["資金費率明顯擁擠（≥ 0.02%）", T.filter(t => t.crowding != null && t.crowding >= 0.02)], ["資金費率不擁擠", T.filter(t => t.crowding != null && t.crowding < 0.02)],
          ["強勢版，孤單訊號", T.filter(t => kindOf(t.pattern) === "strong" && t.breadth === 1)], ["強勢版，有其他商品同步", T.filter(t => kindOf(t.pattern) === "strong" && t.breadth >= 2)]])}
        <details class="about" style="margin:8px 0 0"><summary>這些條件怎麼定義</summary><p>回測為負的組合：${P.neg_frozen} 固定的 ${P.neg_count} 個（規則 × 週期 × 商品 × 形態）。擁擠：進場前資金費率顯示自己這一邊要多付 0.02% 以上。孤單訊號：強勢版進場時沒有其他商品同方向出現強勢訊號。</p></details></div>` : ""}
    </div>
    <div class="card"><h2>最近的進出場</h2><p class="sub">最新的在最上面。</p><div class="events">${events}</div></div>`;
}

function paperPositions(P) {
  const pos = P.positions || [];
  if (!P.positions_updated || !pos.length) return `<div class="card"><div class="empty">${P.positions_updated ? "目前沒有持倉。" : "機器人還沒有回報持倉。"}</div></div>`;
  const by = {};
  for (const p of pos) (by[p.symbol] ||= []).push(p);
  const coins = Object.entries(by).map(([sym, ps]) => ({ sym, ps, r: ps.reduce((a, p) => a + p.R, 0) })).sort((a, b) => b.r - a.r);
  P._flat = coins.flatMap(c => c.ps);
  let i = 0;
  const list = coins.map(c => `<div class="grp"><b>${coin(c.sym)}</b><span>現價 ${fmtP(c.ps[0].last)}</span><span class="r">${c.ps.length > 1 ? "合計 " : ""}${rSpan(c.r)}</span></div>`
    + c.ps.map(p => `<button class="item" data-i="${i++}"><span class="l1">${chip(p.side)} ${acctName(p)}</span><span class="l2">進場 ${fmtDT(p.t_entry)} · 已持有 ${span(p.t_entry, P.positions_updated)}${is4(p) ? ` · 已停利 ${p.tp_hit ?? 0} 段` : ""}${p.stop !== p.stop0 ? " · 止損已移動" : ""}</span><span class="r">${rSpan(p.R)}</span></button>`).join("")).join("");
  return `<p class="sub">資料更新於 ${fmtDT(P.positions_updated)}（台北時間），每 4 小時更新一次。浮動損益以最近一根已收盤 K 棒的收盤價計算，未扣出場成本。點一筆看它的 K 線圖。</p>
    <div class="md"><div class="card detail" id="pdetail"><h2 id="pt"></h2><div class="tags" id="ptags"></div><dl class="facts2" id="pf"></dl>
      <div class="seg" id="pcseg" style="margin:0 0 6px"></div>${CHART_LEGEND}<div class="chart" id="pc"></div></div>
    <div class="card list" id="plist">${list}</div></div>`;
}
function bindPositions(P) {
  if (!$("#plist")) return;
  const pick = (i, jump) => { const p = P._flat[PV.pos = Math.min(i, P._flat.length - 1)];
    $("#pt").textContent = `${coin(p.symbol)} · ${acctName(p)}`;
    $("#ptags").innerHTML = `${chip(p.side)}<span class="chip">持倉中</span><span class="chip">${p.timeframe} 週期</span>${p.neg_combo ? '<span class="chip">回測為負的組合</span>' : ""}`;
    $("#pf").innerHTML = fact("浮動損益", rSpan(p.R)) + fact("進場", `${fmtP(p.entry)}<small>${fmtDT(p.t_entry)}</small>`)
      + fact("現價", `${fmtP(p.last)}<small>${sgn((p.last / p.entry - 1) * 100)}%</small>`)
      + fact("目前止損", `${fmtP(p.stop)}${p.stop !== p.stop0 ? `<small>原本 ${fmtP(p.stop0)}</small>` : ""}`) + fact("目標", tgtText(p)) + extraFacts(p);
    showChart($("#pcseg"), $("#pc"), { ...p, t_exit: null, exit: null });
    document.querySelectorAll("#plist .item").forEach(b => b.setAttribute("aria-current", +b.dataset.i === PV.pos));
    if (jump && narrow()) $("#pdetail").scrollIntoView({ behavior: "smooth", block: "start" }); };
  $("#plist").addEventListener("click", e => { const b = e.target.closest(".item"); if (b) pick(+b.dataset.i, true); });
  pick(PV.pos);
}

function paperClosed(P, T) {
  if (!T.length) return '<div class="card"><div class="empty">還沒有已結束的交易。機器人每 4 小時檢查一次，有交易結束就會出現在這裡。</div></div>';
  const seg = (k, opts) => `<span class="seg">${opts.map(([v, l]) => `<button data-pf="${k}" data-v="${v}" aria-pressed="${PV[k] === v}">${l}</button>`).join("")}</span>`;
  const idx = T.map((_, i) => i).filter(i => (PV.res === "all" || (PV.res === "win") === (T[i].R_net > 0.05)) && (PV.kind === "all" || kindOf(T[i].pattern) === PV.kind))
    .sort((a, b) => T[b].t_exit - T[a].t_exit);
  P._closed = idx;
  const list = idx.map(i => { const t = T[i]; return `<button class="item" data-i="${i}"><span class="l1">${coin(t.symbol)} ${chip(t.side)} ${t.pattern}</span><span class="l2">出場 ${fmtDT(t.t_exit)} · ${t.reason}</span><span class="r">${rSpan(t.R_net)}</span></button>`; }).join("");
  return `<div class="toolbar"><label>結果 ${seg("res", [["all", "全部"], ["win", "獲利"], ["loss", "虧損"]])}</label>
      <label>帳戶 ${seg("kind", [["all", "全部"], ["base", "原規則"], ["base4", "原規則四段"], ["strong", "強勢"], ["tp4", "強勢四段"]])}</label><span>${idx.length} 筆，最新出場的在最上面</span></div>
    ${idx.length ? `<div class="md"><div class="card detail" id="tdetail"><h2 id="tt"></h2><div class="tags" id="ttags"></div><dl class="facts2" id="tf"></dl>
      <div class="seg" id="ccseg" style="margin:0 0 6px"></div>${CHART_LEGEND}<div class="chart" id="cc"></div></div>
    <div class="card list" id="tlist">${list}</div></div>` : '<div class="card"><div class="empty">沒有符合條件的交易。</div></div>'}`;
}
function bindClosed(P, T) {
  document.querySelectorAll("button[data-pf]").forEach(b => b.addEventListener("click", () => { PV[b.dataset.pf] = b.dataset.v; renderPaper(); }));
  if (!$("#tlist")) return;
  const pick = (i, jump) => { const t = T[PV.trade = i];
    $("#tt").textContent = `${coin(t.symbol)} · ${t.pattern}`;
    $("#ttags").innerHTML = `${chip(t.side)}<span class="chip">${t.reason}</span><span class="chip">${t.timeframe} 週期</span><span class="chip">${+t.volume_confirmed ? "突破有放量" : "突破未放量"}</span>${t.neg_combo ? '<span class="chip">回測為負的組合</span>' : ""}`;
    $("#tf").innerHTML = fact("結果", `${rSpan(t.R_net)}<small>${fmtM(t.pnl)} USDT</small>`) + fact("進場", `${fmtP(t.entry)}<small>${fmtDT(t.t_entry)}</small>`)
      + fact("出場", `${fmtP(t.exit)}<small>${fmtDT(t.t_exit)}</small>`) + fact("持有", span(t.t_entry, t.t_exit)) + fact("止損", fmtP(t.stop)) + fact("目標", tgtText(t)) + extraFacts(t);
    showChart($("#ccseg"), $("#cc"), t);
    document.querySelectorAll("#tlist .item").forEach(b => b.setAttribute("aria-current", +b.dataset.i === i));
    if (jump && narrow()) $("#tdetail").scrollIntoView({ behavior: "smooth", block: "start" }); };
  $("#tlist").addEventListener("click", e => { const b = e.target.closest(".item"); if (b) pick(+b.dataset.i, true); });
  pick(P._closed.includes(PV.trade) ? PV.trade : P._closed[0]);
}

function paperAccounts(P, T) {
  const cols = [["", "等幅目標"], ["｜四段", "四段停利"], ["｜強勢", "4H"], ...TFX.map(n => [`｜強勢｜${n}`, n]), ["｜強勢四段", "4H"], ...TFX.map(n => [`｜強勢四段｜${n}`, n])];
  const edge = new Set([2, 6]);                     // columns that start a new group
  const stat = {}, open = {};
  for (const t of T) { const x = stat[t.pattern] ||= { n: 0, r: 0 }; x.n++; x.r += t.R_net; }
  for (const p of P.positions || []) open[p.account] = (open[p.account] || 0) + 1;
  const pats = Object.keys(P.equity).filter(k => !k.includes("｜"));
  const sideOf = p => { const i = HS.patterns.indexOf(p); return i < 0 ? null : HS.sides[i] > 0 ? "LONG" : "SHORT"; };
  const cell = (label, j) => { const x = stat[label], o = open[label], e = P.equity[label], g = edge.has(j) ? " g" : "";
    if (!x && !o) return `<td class="num dim${g}">—</td>`;
    return `<td class="num${g}" title="${label}：權益 ${e == null ? "—" : e.toLocaleString("en-US", { maximumFractionDigits: 0 })} USDT">${x ? rSpan(x.r, 1) : "—"}<small>${[x ? `${x.n} 筆` : "", o ? `持倉 ${o}` : ""].filter(Boolean).join(" · ")}</small></td>`; };
  const total = (suffix, j) => { const g = T.filter(t => t.pattern.endsWith(suffix) && t.pattern.split("｜").slice(1).join("｜") === suffix.slice(1)), r = g.reduce((a, t) => a + t.R_net, 0);
    return `<td class="num${edge.has(j) ? " g" : ""}">${g.length ? rSpan(r, 1) + `<small>${g.length} 筆</small>` : "—"}</td>`; };
  const active = Object.values(P.equity).filter(e => e !== DATA.start_equity).length;
  return `<details class="about"><summary>帳戶怎麼分</summary><p>每個帳戶各自從 ${DATA.start_equity.toLocaleString("en-US")} USDT 開始，每筆風險 ${DATA.risk_pct}%。每種形態在 4 小時線有四個帳戶：原規則（每個形態突破都做，目標是形態等幅）、原規則四段（同一批進場，改用四段出場）、強勢（只做放量的強勢突破，到 1R 後用移動止損）、強勢四段（同一批強勢進場，1R、2R、3R 各出 25%，第一次停利後止損移到進場價，最後 25% 用移動止損）。後兩種另外在 8 小時、12 小時、日線各有一個。</p></details>
    <div class="card"><h2>各帳戶已結束交易的合計</h2><p class="sub">共 ${Object.keys(P.equity).length} 個帳戶，${active} 個已有交易結束。每格是該帳戶的合計 R 與筆數；「—」是還沒有交易。</p>
      <div class="tablewrap free"><table class="matrix"><thead>
        <tr><th rowspan="2">形態</th><th class="g" colspan="2">原規則（4H）</th><th class="g" colspan="4">強勢（移動止損）</th><th class="g" colspan="4">強勢四段停利</th></tr>
        <tr>${cols.map(([, n], j) => `<th class="num${j === 0 || edge.has(j) ? " gl" : ""}">${n}</th>`).join("")}</tr></thead>
        <tbody>${pats.map(p => `<tr><td>${p} ${sideOf(p) ? chip(sideOf(p)) : ""}</td>${cols.map(([sfx], j) => cell(p + sfx, j).replace('class="num', j === 0 ? 'class="num g' : 'class="num')).join("")}</tr>`).join("")}</tbody>
        <tfoot><tr><td>合計</td>${cols.map(([sfx], j) => total(sfx, j).replace('class="num', j === 0 ? 'class="num g' : 'class="num')).join("")}</tr></tfoot></table></div></div>`;
}

function renderPaper() {
  const P = DATA.paper, T = P.trades, view = $("#view"), pos = P.positions || [];
  const secs = [["overview", "總覽"], ["positions", `持倉 ${pos.length}`], ["closed", `已結束 ${T.length}`], ["accounts", "帳戶"]];
  view.innerHTML = `<div class="seg subnav">${secs.map(([k, l]) => `<button data-sec="${k}" aria-pressed="${PV.sec === k}">${l}</button>`).join("")}</div>
    ${PV.sec === "overview" ? `<p class="sub">${P.started_at ? `從 ${fmtDT(P.started_at)}（台北時間）開始實測，機器人每 4 小時檢查一次。` : "模擬交易尚未啟動。"}</p>` : ""}
    ${{ overview: paperOverview, positions: paperPositions, closed: paperClosed, accounts: paperAccounts }[PV.sec](P, T)}`;
  view.querySelectorAll("button[data-sec]").forEach(b => b.addEventListener("click", () => { PV.sec = b.dataset.sec; renderPaper(); }));
  history.replaceState(null, "", "#paper/" + PV.sec);
  if (PV.sec === "overview" && $("#pcum")) { let c = 0; cumChart($("#pcum"), [{ name: "全部", color: C.all, pts: [[P.started_at, 0], ...[...T].sort((a, b) => a.t_exit - b.t_exit).map(t => [t.t_exit, c += t.R_net]), [Math.max(P.positions_updated || 0, ...T.map(t => t.t_exit)), c]] }]); }
  if (PV.sec === "positions") bindPositions(P);
  if (PV.sec === "closed") bindClosed(P, T);
}

$("#meta").textContent = `16 種 K 線形態 · ${N_ALL} 個商品 · 4H、8H、12H、日線 · 更新於 ${fmtDT(DATA.paper.positions_updated || DATA.generated)}（台北時間）`;
const [h0, h1] = location.hash.slice(1).split("/");
let current = h0 === "history" || h0 === "paper" ? h0 : DATA.paper.positions_updated ? "paper" : "history";      // open on the live paper test when it is running
if (current === "paper" && ["overview", "positions", "closed", "accounts"].includes(h1)) PV.sec = h1;
const render = k => { current = k; document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.k === k));
  if (k === "history") { history.replaceState(null, "", "#history"); renderHistory(); } else renderPaper(); };
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => render(b.dataset.k)));
render(current);
let rz, lastW = innerWidth;                        // redraw charts when the width changes (not when a phone's address bar hides)
addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rz); rz = setTimeout(() => render(current), 150); });
</script>
</body>
</html>
